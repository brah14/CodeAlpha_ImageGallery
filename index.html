<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huno's Image Gallery | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Huno's Image Gallery</h1>
    <p class="subtitle">Browse, filter and view photos in full screen</p>

    <div class="controls">
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      <label class="search">
        <span class="sr-only">Search images</span>
        <input type="search" id="search" placeholder="Search images..." autocomplete="off">
      </label>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <main>
    <ul class="gallery" id="gallery"></ul>
    <p class="empty" id="empty" hidden>No images match your search.</p>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-nav lb-prev" id="lbPrev" aria-label="Previous image">&#10094;</button>

    <figure class="lb-stage" id="lbStage">
      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>

    <button class="lb-btn lb-nav lb-next" id="lbNext" aria-label="Next image">&#10095;</button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
